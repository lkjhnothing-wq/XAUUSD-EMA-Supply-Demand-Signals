<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMA Supply & Demand Scanner</title><style>body{margin:0;background:#081018;color:#eef4fa;font:14px Arial}header,.wrap{max-width:1450px;margin:auto;padding:18px}.live{color:#39d98a;font-weight:bold}.clock{margin-left:12px;color:#91a2b4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#0d1722;border:1px solid #233346;border-radius:14px;padding:14px}.chart{width:100%;height:420px;border:0;border-radius:10px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1e2b38}.buy{color:#39d98a}.sell{color:#ff6b81}.wait{color:#f7c95c}.pair{font-size:18px;font-weight:bold;margin-bottom:10px}.sig{margin:10px 0;padding:12px;border-radius:10px;background:#081018;font-weight:bold}.muted{color:#91a2b4}@media(max-width:1050px){.grid{grid-template-columns:1fr}.chart{height:500px}}</style></head><body><header><b>EMA + SUPPLY & DEMAND • LIVE SCANNER</b><span class="live"> ● RUNNING</span><span id="clock" class="clock">—</span><div class="muted">UTC+4 (Dubai/Oman) • Scans every 1 minute</div></header><main class="wrap"><div class="grid"><section class="card"><div class="pair">USDJPY 🥇</div><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=OANDA%3AUSDJPY&interval=5&theme=dark&style=1&timezone=Asia%2FDubai"></iframe><div id="USDJPY-sig" class="sig wait">STARTING...</div><div id="USDJPY-details"></div></section><section class="card"><div class="pair">EURUSD 🥈</div><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=OANDA%3AEURUSD&interval=5&theme=dark&style=1&timezone=Asia%2FDubai"></iframe><div id="EURUSD-sig" class="sig wait">STARTING...</div><div id="EURUSD-details"></div></section><section class="card"><div class="pair">XAUUSD</div><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=OANDA%3AXAUUSD&interval=5&theme=dark&style=1&timezone=Asia%2FDubai"></iframe><div id="XAUUSD-sig" class="sig wait">STARTING...</div><div id="XAUUSD-details"></div></section></div><section class="card" style="margin-top:16px"><b>Strategy:</b> EMA 200 trend → EMA 50 confirmation → Supply/Demand zone → Strong rejection → TP1 1:2 → TP2 1:3</section></main><script>const pairs=['USDJPY','EURUSD','XAUUSD'];const f=x=>Number(x).toFixed(2);function time(){clock.textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dubai',hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'short',year:'numeric'}).format(new Date())}function render(p,s){const cls=s.signal==='BUY'?'buy':s.signal==='SELL'?'sell':'wait',sig=document.getElementById(p+'-sig'),d=document.getElementById(p+'-details');sig.className='sig '+cls;sig.textContent=s.signal==='WAIT'?s.reason:`${s.signal} • ENTRY ${f(s.entry)} • SL ${f(s.sl)} • TP1 ${f(s.tp1)} • TP2 ${f(s.tp2)}`;d.innerHTML=[['STATUS',s.signal],['TREND',s.trend],['ZONE',s.zone||'—'],['PRICE',s.price?f(s.price):'—'],['EMA 50',s.ema50?f(s.ema50):'—'],['EMA 200',s.ema200?f(s.ema200):'—'],['RISK',s.risk?f(s.risk):'—']].map(x=>`<div class="row"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}async function run(){await Promise.all(pairs.map(async p=>{try{const r=await fetch('/api/signal?pair='+p+'&ts='+Date.now(),{cache:'no-store'});render(p,await r.json())}catch(e){document.getElementById(p+'-sig').textContent='SCANNER RETRYING'}}))}time();setInterval(time,1000);run();setInterval(run,60000);</script></body></html>

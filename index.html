<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XAUUSD EMA + Supply & Demand</title><style>body{margin:0;background:#081018;color:#eef4fa;font:14px Arial}header,.wrap{max-width:1300px;margin:auto;padding:18px}.card{background:#0d1722;border:1px solid #233346;border-radius:14px;margin-bottom:16px;padding:16px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.chart{width:100%;height:620px;border:0}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #1e2b38}.buy{color:#39d98a}.sell{color:#ff6b81}.wait{color:#f7c95c}.muted{color:#91a2b4}@media(max-width:850px){.grid{grid-template-columns:1fr}.chart{height:500px}}</style></head><body><header><b>XAUUSD EMA + SUPPLY & DEMAND</b><span id="status" class="wait"> • SCANNING</span></header><main class="wrap"><div class="grid"><div class="card"><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=OANDA%3AXAUUSD&interval=5&theme=dark&style=1&timezone=Etc%2FUTC"></iframe><div class="card" id="signal">WAITING FOR HIGH QUALITY SETUP</div></div><div class="card"><h3>LIVE SETUP</h3><div id="details"></div></div></div><div class="card"><h3>STRATEGY</h3><div class="row">1. EMA 200 = Main Trend</div><div class="row">2. EMA 50 = Momentum Confirmation</div><div class="row">3. Supply/Demand Zone</div><div class="row">4. Strong Rejection Candle</div><div class="row">5. TP1 1:2 • TP2 1:3</div></div></main><script>const f=x=>Number(x).toFixed(2);async function run(){try{let r=await fetch('/api/signal',{cache:'no-store'}),s=await r.json();let cls=s.signal==='BUY'?'buy':s.signal==='SELL'?'sell':'wait';status.className=cls;status.textContent=' • '+(s.signal==='WAIT'?'WAITING':'LIVE '+s.signal);signal.className='card '+cls;signal.textContent=s.signal==='WAIT'?s.reason:`${s.signal} • ENTRY ${f(s.entry)} • SL ${f(s.sl)} • TP1 ${f(s.tp1)} • TP2 ${f(s.tp2)}`;details.innerHTML=[['TREND',s.trend],['ZONE',s.zone],['EMA 50',s.ema50],['EMA 200',s.ema200],['ENTRY',s.entry?f(s.entry):'—'],['STOP',s.sl?f(s.sl):'—'],['TP1',s.tp1?f(s.tp1):'—'],['RISK',s.risk?f(s.risk):'—'],['REASON',s.reason]].map(x=>`<div class="row"><b>${x[0]}</b><span>${x[1]??'—'}</span></div>`).join('')}catch(e){status.textContent=' • DATA ERROR'}}run();setInterval(run,300000)</script></body></html>
